# firepack — bundled example.
#
# Multi-tenant blog spec used as a smoke-test for every feature:
#   - collections, indexes, queries, rules
#   - storage buckets + storageRef[X]
#   - shared enums (enum[X])
#   - nested types (type[X])
#
# This is *not* the WorkBrief spec — that one lives in the WorkBrief
# repository at `app/firepack.yaml`. firepack stays domain-neutral.

firepack: 1
project: blog

# --- Shared enums -------------------------------------------------------
# Defined once, referenced from any field via `enum[<Name>]`. Use this
# when the same enum is shared across collections / nested types. For
# one-off enums, inline `type: enum, values: [..]` still works.

enums:

  PostStatus:
    values: [draft, published, archived]

  UserRole:
    values: [admin, author, reader]

# --- Nested types -------------------------------------------------------
# Embedded value-objects stored as Maps inside their parent doc.
# Referenced from fields via `type[<Name>]` or `list[type[<Name>]]`.

types:

  LinkPreview:
    fields:
      url:         { type: string, required: true }
      title:       { type: string, required: true }
      description: { type: string, optional: true }
      imageUrl:    { type: string, optional: true }

# --- Storage buckets ----------------------------------------------------
# Logical Cloud-Storage path templates. Referenced from collection
# fields via `storageRef[<bucket>]` so the cross-system edge is
# explicit in the data model.

storage:

  postCovers:
    path: "covers/{organizationId}/{postId}.jpg"
    tenant: organizationId
    contentTypes: [image/jpeg, image/png]

  attachments:
    path: "attachments/{organizationId}/{postId}/{attachmentId}"
    tenant: organizationId
    contentTypes: [application/pdf, image/jpeg, image/png]

# --- Collections --------------------------------------------------------

collections:

  organizations:
    fields:
      id:        { type: string, primaryKey: true }
      name:      { type: string, required: true }
      createdAt: { type: dateTime, required: true, serverDefault: now }

  users:
    tenant: organizationId
    fields:
      id:             { type: string, primaryKey: true }
      organizationId: { type: "ref[organizations.id]", required: true }
      displayName:    { type: string, required: true }
      email:          { type: string, required: true }
      role:           { type: "enum[UserRole]", default: reader }

  posts:
    tenant: organizationId
    fields:
      id:             { type: string, primaryKey: true }
      organizationId: { type: "ref[organizations.id]", required: true }
      authorId:       { type: "ref[users.id]", required: true }
      title:          { type: string, required: true }
      body:           { type: string, required: true }
      coverImage:     { type: "storageRef[postCovers]", optional: true }
      attachments:    { type: list, default: [], of: { type: "storageRef[attachments]" } }
      linkPreview:    { type: "type[LinkPreview]", optional: true }
      status:         { type: "enum[PostStatus]", default: draft }
      createdAt:      { type: dateTime, required: true, serverDefault: now }
      publishedAt:    { type: dateTime, optional: true }

    indexes:
      - fields: [organizationId, status, createdAt:desc]
      - fields: [organizationId, authorId, createdAt:desc]

    queries:
      watchByOrg:
        where: [tenant]
        orderBy: createdAt:desc
        limit: 50
      watchByOrgAndStatus:
        where: [tenant, "status == $status"]
        orderBy: createdAt:desc
      watchById:
        byId: true

  comments:
    tenant: organizationId
    fields:
      id:             { type: string, primaryKey: true }
      organizationId: { type: "ref[organizations.id]", required: true }
      postId:         { type: "ref[posts.id]", required: true }
      authorId:       { type: "ref[users.id]", required: true }
      body:           { type: string, required: true }
      createdAt:      { type: dateTime, required: true, serverDefault: now }
    indexes:
      - fields: [postId, createdAt:asc]
