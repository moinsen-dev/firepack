# firepack watch config — for the bundled example app.
#
# Run from this directory (example/):
#   firepack watch
#
# `--spec firepack.yaml --config firepack.config.yaml` are picked up by
# default since both files live next to each other. Editing `firepack.yaml`
# regenerates models, repos, indexes, rules, storage paths, and the
# Mermaid diagram in-place — the example Flutter app picks them up
# immediately.
#
# In real consumption, a file like this lives next to YOUR `firepack.yaml`
# in YOUR repo (NOT inside firepack's own example tree).

targets:

  indexes:
    out: firestore.indexes.json

  rules:
    out: firestore.rules

  models:
    out: lib/firepack/models

  repos:
    out: lib/firepack/repositories

  storage:
    out: lib/firepack/storage_paths.dart

  paths:
    out: lib/firepack/paths.dart

  viz:
    out: DATA_MODEL.md
