# firepack watch config — example for the bundled blog spec.
#
# Run from this directory:
#   firepack watch --spec blog.firepack.yaml --config firepack.config.yaml
#
# In real consumption, this file lives next to YOUR `firepack.yaml`
# in YOUR repo (NOT inside firepack/example) — see for instance the
# WorkBrief consumer at `~/work/moinsen/ideas/work_brief/app/firepack.config.yaml`.

targets:

  indexes:
    out: /tmp/blog.indexes.json

  rules:
    out: /tmp/blog.rules

  models:
    out: /tmp/blog/models
    collection: posts

  repos:
    out: /tmp/blog/repos
    collection: posts
