name: firepack
description: >
  Spec-driven Firestore + Flutter codegen. Define your collections, fields,
  indexes, and rules in one YAML file. Get back typed Dart models, Riverpod
  providers, repositories, security rules, indexes, TypeScript types, and a
  visual data-model graph — regenerated on every save.
version: 0.0.14
publish_to: none
homepage: https://github.com/moinsen-dev/firepack

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.7.0
  yaml: ^3.1.3
  path: ^1.9.1
  collection: ^1.19.1
  watcher: ^1.2.1

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0

executables:
  firepack: firepack
