<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Top badge -->
  <g transform="translate(60, 60)">
    <rect width="290" height="36" rx="18" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-opacity="0.35"/>
    <text x="20" y="24" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fb923c" letter-spacing="1">🔥 PRE-PUB · v0.0.15 · 62 TESTS</text>
  </g>

  <!-- Wordmark top-right -->
  <g transform="translate(1140, 78)" text-anchor="end">
    <text font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">🔥 firepack</text>
  </g>

  <!-- Hero title -->
  <g transform="translate(60, 220)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">One YAML spec.</text>
    <text y="92" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#fire)" letter-spacing="-2">Your entire Firestore data layer.</text>
  </g>

  <!-- Subline -->
  <g transform="translate(60, 430)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9ca3af" letter-spacing="-0.3">Spec-driven Flutter + Firestore codegen — typed models,</text>
    <text y="36" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9ca3af" letter-spacing="-0.3">repositories, providers, rules, indexes &amp; a Mermaid graph.</text>
  </g>

  <!-- Output strip -->
  <g transform="translate(60, 540)">
    <rect width="1080" height="42" rx="10" fill="url(#card-bg)" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="20" y="27" font-family="Menlo, ui-monospace, monospace" font-size="14" fill="#9ca3af">
      <tspan fill="#fb923c">$ firepack regen</tspan>
      <tspan fill="#6b7280">  →</tspan>
      <tspan fill="#e5e7eb">  paths.dart · models/*.dart · repositories/*.dart · firestore.rules · firestore.indexes.json · DATA_MODEL.md</tspan>
    </text>
  </g>

  <!-- Footer URL -->
  <text x="60" y="610" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280" letter-spacing="0.5">github.com/moinsen-dev/firepack</text>
  <text x="1140" y="610" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280" letter-spacing="0.5">MIT licensed · pure Dart · no build_runner</text>
</svg>
